<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>桌面看板</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card">
      <header class="hdr">
        <svg class="app-icon" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6FB6FF" />
              <stop offset="1" stop-color="#A07BFF" />
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="22" height="22" rx="7" fill="url(#iconGrad)" />
          <circle cx="12" cy="12" r="6.3" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.6" />
          <path d="M12 8.6V12l2.5 1.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <h1 class="title">屏幕使用时间</h1>
        <span class="date" id="date">11月9日 周日</span>
        <button class="icon-btn pin" id="pin" title="固定到桌面（不挡住其它窗口）" aria-label="固定到桌面">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M14.2 3.6l6.2 6.2-1.7 1.7-.9-.3-3.6 3.6.4 3.2-1.4 1.4-3.1-3.1-4.3 4.3-1.1-1.1 4.3-4.3-3.1-3.1 1.4-1.4 3.2.4 3.6-3.6-.3-.9z"
              fill="currentColor"
              stroke="none"
            />
          </svg>
        </button>
        <button class="icon-btn more" id="more" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="12" r="1.7" />
            <circle cx="12" cy="12" r="1.7" />
            <circle cx="19" cy="12" r="1.7" />
          </svg>
        </button>
      </header>

      <section class="hero">
        <div class="hero-label">今日使用</div>
        <div class="hero-value" id="heroValue"><span class="unit">0 分钟</span></div>
      </section>

      <div class="wx" id="wx" hidden>
        <div class="wx-main">
          <span class="wx-icon" id="wxIcon">⛅</span>
          <span class="wx-temp" id="wxTemp">--°</span>
        </div>
        <div class="wx-meta" id="wxMeta">天气加载中…</div>
      </div>

      <section class="goal">
        <div class="track"><div class="fill" id="goalFill"></div></div>
        <div class="goal-text" id="goalText">目标 8 小时</div>
      </section>

      <section class="stats">
        <div class="stat">
          <span class="stat-k">本次开机</span>
          <span class="stat-v" id="session">00:00:00</span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-k">近 7 日日均</span>
          <span class="stat-v" id="avg">—</span>
        </div>
        <div class="divider"></div>
        <div class="stat">
          <span class="stat-k">电量</span>
          <span class="stat-v" id="battery">—</span>
        </div>
      </section>

      <section class="chart">
        <div class="bars" id="bars"></div>
        <div class="labels" id="labels"></div>
      </section>

      <div class="hint" id="hint" hidden></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
